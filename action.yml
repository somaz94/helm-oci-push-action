name: Helm OCI Push
description: Push Helm charts to any OCI registry (GHCR, ECR, GAR, Harbor, Quay) via tarball glob, chart paths, or directory scan.
author: somaz94

branding:
  icon: upload-cloud
  color: blue

inputs:
  tarballs:
    description: 'Glob pattern for pre-packaged chart tarballs (e.g., dist/*.tgz, /tmp/staging/*.tgz)'
    required: false
    default: ''
  charts:
    description: 'Comma-separated chart directory paths to package and push (e.g., charts/foo,charts/bar)'
    required: false
    default: ''
  charts_dir:
    description: 'Directory whose immediate subdirectories are treated as charts to package and push'
    required: false
    default: ''
  registry:
    description: 'Target OCI registry URL (e.g., oci://ghcr.io/<owner>/charts, oci://harbor.example.com/charts)'
    required: false
    default: 'oci://ghcr.io/${{ github.repository_owner }}/charts'
  registry_login:
    description: 'Whether the action should log in to the registry. Set false if a previous step already logged in.'
    required: false
    default: 'true'
  username:
    description: 'Registry username (used when registry_login is true)'
    required: false
    default: ${{ github.actor }}
  password:
    description: 'Registry password or token (used when registry_login is true). Typically secrets.GITHUB_TOKEN for GHCR.'
    required: false
    default: ''
  dry_run:
    description: 'If true, package and validate but do not push to the registry'
    required: false
    default: 'false'
  skip_existing:
    description: 'If true, skip chart@version pairs that already exist in the registry (best-effort HEAD check)'
    required: false
    default: 'false'
  continue_on_error:
    description: 'If true, continue with the next chart when a push fails instead of failing the step. Failed charts are listed in the failed_charts output.'
    required: false
    default: 'false'
  push_retries:
    description: 'How many times to retry a failed helm push before giving up (0 disables retries)'
    required: false
    default: '3'
  push_retry_delay:
    description: 'Seconds to wait before the first retry; the wait doubles on each further retry, up to 300'
    required: false
    default: '5'

outputs:
  pushed_charts:
    description: 'Comma-separated list of name:version pairs actually pushed'
  skipped_charts:
    description: 'Comma-separated list of name:version pairs skipped (existing or dry-run)'
  failed_charts:
    description: 'Comma-separated list of name:version pairs that failed to push, or the tarball file name when its Chart.yaml could not be read (only non-empty with continue_on_error)'

runs:
  using: docker
  # Decided 2026-08-07: pull a prebuilt image (built from Dockerfile, which
  # ci.yml still builds on every PR) instead of building one per consumer run
  # (~31s). Subtle: this version's image must be published (release.yml
  # workflow_dispatch) before its git tag is pushed, and a runner can pull only
  # the pushed platforms (linux/amd64, linux/arm64).
  image: docker://ghcr.io/somaz94/helm-oci-push-action:v1.2.0
  env:
    INPUT_TARBALLS: ${{ inputs.tarballs }}
    INPUT_CHARTS: ${{ inputs.charts }}
    INPUT_CHARTS_DIR: ${{ inputs.charts_dir }}
    INPUT_REGISTRY: ${{ inputs.registry }}
    INPUT_REGISTRY_LOGIN: ${{ inputs.registry_login }}
    INPUT_USERNAME: ${{ inputs.username }}
    INPUT_PASSWORD: ${{ inputs.password }}
    INPUT_DRY_RUN: ${{ inputs.dry_run }}
    INPUT_SKIP_EXISTING: ${{ inputs.skip_existing }}
    INPUT_CONTINUE_ON_ERROR: ${{ inputs.continue_on_error }}
    INPUT_PUSH_RETRIES: ${{ inputs.push_retries }}
    INPUT_PUSH_RETRY_DELAY: ${{ inputs.push_retry_delay }}
